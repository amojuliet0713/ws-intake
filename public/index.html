<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Williams &amp; Seemen APLC - Intake</title>
<script src="/react.min.js"></script>
<script src="/react-dom.min.js"></script>
<script src="/babel.min.js"></script>
<script src="/pdf-lib.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--nv:#1a1a3e;--re:#c0392b;--bg:#f4f6f9;--ca:#fff;--bd:#dde1e9;--tx:#1a1a2e;--mu:#6b7280;--sg:#166534;--sb:#dcfce7;--wa:#92400e;--wb:#fef3c7}
body{font-family:-apple-system,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
#root{min-height:100vh}
.tb{background:var(--nv);color:#fff;padding:0 2rem;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.tl{width:36px;height:36px;background:var(--re);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;text-align:center}
.mn{max-width:1100px;margin:0 auto;padding:2rem}
.sb2{display:flex;margin-bottom:2rem;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--bd)}
.st{flex:1;display:flex;align-items:center;gap:10px;padding:14px 16px;position:relative;color:var(--mu)}
.st+.st::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:1px;height:60%;background:var(--bd)}
.st.ac{background:var(--nv);color:#fff}
.st.dn{background:#f0fdf4;color:var(--sg)}
.sn{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;background:#e5e7eb;color:var(--mu)}
.st.ac .sn{background:rgba(255,255,255,.25);color:#fff}
.st.dn .sn{background:var(--sb);color:var(--sg)}
.sl{font-size:13px;font-weight:500}
.cd{background:var(--ca);border:1px solid var(--bd);border-radius:12px;padding:1.5rem;margin-bottom:1.5rem}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:1.25rem;padding-bottom:1rem;border-bottom:1px solid var(--bd)}
.ci{width:32px;height:32px;background:var(--nv);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px}
.ht{font-size:14px;font-weight:700;color:var(--nv);text-transform:uppercase;letter-spacing:.08em}
.hs{font-size:12px;color:var(--mu);margin-top:2px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.c2{grid-column:span 2}
.fd{display:flex;flex-direction:column;gap:5px}
.fd label{font-size:12px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
.fd input,.fd select,.fd textarea{padding:9px 12px;border:1px solid var(--bd);border-radius:8px;font-size:13px;color:var(--tx);background:#fff}
.fd input:focus,.fd select:focus,.fd textarea:focus{outline:none;border-color:var(--nv)}
.fd textarea{min-height:80px;resize:vertical}
.ai .fd input,.ai .fd select,.ai .fd textarea{border-color:#6366f1;background:#f5f3ff}
.cs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cr{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--bd);border-radius:8px;font-size:13px}
.cr input{width:15px;height:15px;accent-color:var(--nv)}
.ri{display:flex;gap:16px;flex-wrap:wrap;padding:8px 0}
.ri label{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;font-weight:normal;text-transform:none;letter-spacing:0}
.ri input{width:14px;height:14px;accent-color:var(--nv)}
.bn{padding:9px 20px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:8px}
.pn{background:var(--nv);color:#fff}
.pn:hover{background:#2a2a5e}
.po{background:#fff;color:var(--nv);border:1.5px solid var(--nv)}
.po:hover{background:#f0f0f8}
.pg{background:#166534;color:#fff}
.pl{padding:12px 28px;font-size:15px;border-radius:10px}
.bn:disabled{opacity:.5;cursor:not-allowed}
.dz{border:2px dashed var(--bd);border-radius:12px;padding:3rem 2rem;text-align:center;cursor:pointer}
.dz:hover{border-color:var(--nv);background:#f0f0f8}
.di{font-size:48px;margin-bottom:1rem}
.dt{font-size:18px;font-weight:600;color:var(--nv);margin-bottom:8px}
.ds{font-size:14px;color:var(--mu)}
.al{padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:1rem;display:flex;gap:10px}
.ai2{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af}
.as{background:var(--sb);border:1px solid #86efac;color:var(--sg)}
.aw{background:var(--wb);border:1px solid #fcd34d;color:var(--wa)}
.sp{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.vc{border-radius:12px;padding:1.5rem;margin-bottom:1.5rem}
.va{background:var(--sb);border:1.5px solid #86efac}
.vd{background:#fee2e2;border:1.5px solid #fca5a5}
.vr{background:var(--wb);border:1.5px solid #fcd34d}
.sg2{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:1rem 0}
.sb3{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:14px;text-align:center}
.sn2{font-size:22px;font-weight:700}
.sl2{font-size:11px;color:var(--mu);margin-top:2px}
.gt{color:#166534}.rt{color:#991b1b}.at{color:#92400e}
.nb{display:flex;justify-content:space-between;align-items:center;padding-top:1.5rem;border-top:1px solid var(--bd);margin-top:1rem}
.tg{display:inline-block;background:#ede9fe;color:#5b21b6;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600;margin-left:6px}
.bg{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;background:#ede9fe;color:#5b21b6}
.lw{display:flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden;background:#fff}
.ln{background:#f4f6f9;border-right:1px solid var(--bd);padding:9px 8px;font-family:monospace;font-size:12px;color:#9ca3af;line-height:1.6;min-width:36px;text-align:right;user-select:none;white-space:pre}
.lt{font-family:monospace;font-size:12px;border:none;outline:none;padding:9px 12px;flex:1;resize:vertical;line-height:1.6;min-height:180px}
.fi{font-size:11px;color:var(--mu);margin-top:4px}
@media(max-width:700px){.fg,.sg2{grid-template-columns:1fr}.c2{grid-column:span 1}.mn{padding:1rem}.sl{font-size:11px}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useRef}=React;

const EF={intakeDate:"",intakeMethod:"",intakeStaff:"",referralSource:"",attorneyAssigned:"",followUpDate:"",fullName:"",preferredName:"",dob:"",address:"",primaryPhone:"",altPhone:"",email:"",bestContact:"",preferredLanguage:"",emergencyContact:"",priorAttorney:"",priorAttorneyYN:"",defendant:"",isGovtEmployer:"",jobTitle:"",payRate:"",atWillOrContract:"",startDate:"",endDate:"",supervisor:"",employmentStatus:"",terminationDate:"",terminationEmployerReason:"",terminationClientBelief:"",severanceOffered:"",arbitrationAgreement:"",unionMember:"",discriminationBelief:"",discriminationClasses:[],discriminationEvidence:"",oralAnimus:"",writtenAnimus:"",sexualHarassment:"",harassmentDetails:"",hasDisability:"",disabilityNature:"",disabilityDate:"",accommodationRequested:"",accommodationGranted:"",adverseActionDisability:"",leaveTypes:[],leaveReason:"",leaveGranted:"",terminatedAfterLeave:"",exemptStatus:"",hourlyOrSalary:"",mealRestBreaks:"",mealRestDetails:"",overtimePaid:"",overtimeDetails:"",finalPaycheckTimely:"",lostWages:"",lostBenefits:"",medicalTreatment:"",emotionalDistress:"",witnessNames:"",evidenceDocs:[],credibilityNotes:"",redFlags:"",caseStrengths:"",actionItems:"",recommendation:"",_verdict:"",_verdictReason:"",_meritScore:"",_damagesPotential:"",_riskLevel:"",_solUrgency:"",_claimsAnalysis:"",_solNote:"",_strengths:[],_concerns:[],_nextSteps:[]};

const DC=["Race","Color","National Origin","Religion","Sex/Gender","Sexual Orientation","Gender Identity","Age (40+)","Disability","Genetic Info","Marital Status","Pregnancy","Military","Other"];
const LT=["FMLA","CFRA","PDL","CA Paid Sick Leave","Paid Family Leave","Bereavement","Workers Comp","Other"];
const ED=["Offer letter","Employee handbook","Arbitration agreement","Pay stubs","Performance reviews","Written warnings","Emails","Text messages","Termination letter","Medical records","Recordings","Photos"];

function pj(raw){
  let s=raw.replace(/```json/g,"").replace(/```/g,"").trim();
  const a=s.indexOf("{"),b=s.lastIndexOf("}");
  if(a!==-1&&b!==-1)s=s.slice(a,b+1);
  try{return JSON.parse(s);}
  catch(e){s=s.replace(/,(\s*[}\]])/g,"$1");return JSON.parse(s);}
}

function F({l,n,f,sf,t="text",o=[],r=2,ai=false,c2=false}){
  const v=f[n]||"";
  const u=e=>sf(x=>({...x,[n]:e.target.value}));
  return(
    <div className={"fd"+(ai&&v?" ai":"")+(c2?" c2":"")}>
      <label>{l}{ai&&v?<span className="tg">AI</span>:null}</label>
      {t==="ta"?<textarea rows={r} value={v} onChange={u}/>:
       t==="sl"?<select value={v} onChange={u}><option value="">-</option>{o.map(x=><option key={x}>{x}</option>)}</select>:
       t==="ra"?<div className="ri">{o.map(x=><label key={x}><input type="radio" name={n} value={x} checked={v===x} onChange={()=>sf(z=>({...z,[n]:x}))}/>{x}</label>)}</div>:
       <input type={t} value={v} onChange={u}/>}
    </div>
  );
}

function CG({l,n,f,sf,o}){
  const vs=f[n]||[];
  return(
    <div className="fd c2">
      <label>{l}</label>
      <div className="cs">{o.map(x=><label key={x} className="cr"><input type="checkbox" checked={vs.includes(x)} onChange={()=>sf(z=>({...z,[n]:vs.includes(x)?vs.filter(y=>y!==x):[...vs,x]}))}/>{x}</label>)}</div>
    </div>
  );
}

function Bar({s}){
  const ss=["Import","Contact","Claims","Analyze","Download"];
  return(
    <div className="sb2">
      {ss.map((x,i)=>(
        <div key={i} className={"st "+(i+1===s?"ac":i+1<s?"dn":"")}>
          <div className="sn">{i+1<s?"v":i+1}</div>
          <div className="sl">{x}</div>
        </div>
      ))}
    </div>
  );
}

function S1({onDone}){
  const [tx,setTx]=useState("");
  const [busy,setBusy]=useState(false);
  const [er,setEr]=useState("");
  const [ov,setOv]=useState(false);
  const [fn,setFn]=useState("");
  const rf=useRef();
  const lns=(tx||" ").split("\n").map((_,i)=>i+1).join("\n");

  const loadf=async(file)=>{
    setFn(file.name);setEr("");
    const ext=file.name.split(".").pop().toLowerCase();
    if(ext==="txt"){const r=new FileReader();r.onload=e=>setTx(e.target.result);r.readAsText(file);}
    else{
      try{
        const fd=new FormData();fd.append("file",file);
        const res=await fetch("/api/extract-text",{method:"POST",body:fd});
        const d=await res.json();
        if(!res.ok)throw new Error(d.error);
        setTx(d.text);
      }catch(e){setEr("File error: "+e.message);}
    }
  };

  const go=async()=>{
    if(!tx.trim()){setEr("Please upload or paste a document.");return;}
    setBusy(true);setEr("");
    try{
      const today=new Date().toISOString().split("T")[0];
      const keys="fullName,preferredName,dob,address,primaryPhone,altPhone,email,bestContact,preferredLanguage,emergencyContact,priorAttorney,priorAttorneyYN,defendant,isGovtEmployer,jobTitle,payRate,atWillOrContract,startDate,endDate,supervisor,employmentStatus,terminationDate,terminationEmployerReason,terminationClientBelief,severanceOffered,arbitrationAgreement,unionMember,discriminationBelief,discriminationClasses,discriminationEvidence,oralAnimus,writtenAnimus,sexualHarassment,harassmentDetails,hasDisability,disabilityNature,disabilityDate,accommodationRequested,accommodationGranted,adverseActionDisability,leaveTypes,leaveReason,leaveGranted,terminatedAfterLeave,exemptStatus,hourlyOrSalary,mealRestBreaks,mealRestDetails,overtimePaid,overtimeDetails,finalPaycheckTimely,lostWages,lostBenefits,medicalTreatment,emotionalDistress,witnessNames,evidenceDocs,credibilityNotes,redFlags,caseStrengths,actionItems,recommendation,intakeMethod,intakeStaff,referralSource,attorneyAssigned,followUpDate";
      const instr="Extract legal intake info from the document. Use plain ASCII. Return ONLY a JSON object with these keys (empty string or array if missing): "+keys+". Set intakeDate to "+today+". Document follows: ";
      const res=await fetch("/api/claude",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:4000,messages:[{role:"user",content:instr+tx.slice(0,10000)}]}),});
      if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error?.message||"Error "+res.status);}
      const d=await res.json();
      const raw=d.content.map(c=>c.text||"").join("");
      const ext=pj(raw);
      onDone({...EF,...ext,intakeDate:today});
    }catch(e){setEr("Extraction failed: "+e.message);}
    setBusy(false);
  };

  return(
    <div className="cd">
      <div className="ch"><div className="ci">📄</div><div><div className="ht">Import Intake Document</div><div className="hs">Upload PDF, Word, or text — or paste directly</div></div></div>
      <div className={"dz"+(ov?" dz-ov":"")} style={{marginBottom:"1rem"}} onDragOver={e=>{e.preventDefault();setOv(true);}} onDragLeave={()=>setOv(false)} onDrop={e=>{e.preventDefault();setOv(false);if(e.dataTransfer.files[0])loadf(e.dataTransfer.files[0]);}} onClick={()=>rf.current.click()}>
        <div className="di">{fn?"✅":"📂"}</div>
        <div className="dt">{fn||"Drop file here or click to browse"}</div>
        <div className="ds">PDF, Word (.docx), or plain text (.txt)</div>
        <input ref={rf} type="file" accept=".txt,.pdf,.docx" style={{display:"none"}} onChange={e=>{if(e.target.files[0])loadf(e.target.files[0]);}}/>
      </div>
      <div className="fd" style={{marginBottom:"1rem"}}>
        <label>Or paste text directly</label>
        <div className="lw">
          <div className="ln">{lns}</div>
          <textarea className="lt" value={tx} onChange={e=>setTx(e.target.value)} placeholder="Paste the full intake document here..."/>
        </div>
        {tx&&<div className="fi">{tx.split("\n").length} lines · {tx.length} chars</div>}
      </div>
      {er&&<div className="al aw">⚠️ {er}</div>}
      <div className="al ai2">💡 Claude reads the document and auto-fills all fields. Purple = AI-filled.</div>
      <div style={{display:"flex",gap:"10px",justifyContent:"flex-end"}}>
        <button className="bn po" onClick={()=>onDone({...EF})}>Blank form</button>
        <button className="bn pn pl" onClick={go} disabled={busy||!tx.trim()}>{busy?<><span className="sp"/>&nbsp;Extracting...</>:"🤖 Extract & populate →"}</button>
      </div>
    </div>
  );
}

function S2({f,sf,nx,bk}){
  const R=(n,o)=><div className="fd"><label>{n}</label><div className="ri">{o.map(x=><label key={x}><input type="radio" name={n} value={x} checked={f[n]===x} onChange={()=>sf(z=>({...z,[n]:x}))}/>{x}</label>)}</div></div>;
  return(
    <div>
      <div className="cd"><div className="ch"><div className="ci">📋</div><div><div className="ht">Intake Header</div></div></div>
        <div className="fg">
          <F l="Intake Date" n="intakeDate" t="date" f={f} sf={sf} ai/>
          <F l="Method" n="intakeMethod" t="sl" o={["Phone","In-Person","Zoom","Email"]} f={f} sf={sf} ai/>
          <F l="Staff Name" n="intakeStaff" f={f} sf={sf}/>
          <F l="Referral Source" n="referralSource" f={f} sf={sf} ai/>
          <F l="Attorney Assigned" n="attorneyAssigned" f={f} sf={sf}/>
          <F l="Follow-Up Date" n="followUpDate" t="date" f={f} sf={sf}/>
        </div>
      </div>
      <div className="cd"><div className="ch"><div className="ci">👤</div><div><div className="ht">Client Contact</div></div></div>
        <div className="fg">
          <F l="Full Name" n="fullName" f={f} sf={sf} ai/>
          <F l="Preferred Name" n="preferredName" f={f} sf={sf} ai/>
          <F l="Date of Birth" n="dob" t="date" f={f} sf={sf} ai/>
          <F l="Primary Phone" n="primaryPhone" f={f} sf={sf} ai/>
          <F l="Email" n="email" f={f} sf={sf} ai/>
          <F l="Alt Phone" n="altPhone" f={f} sf={sf} ai/>
          <F l="Address" n="address" f={f} sf={sf} ai c2/>
          <F l="Best Contact Time" n="bestContact" f={f} sf={sf} ai/>
          <F l="Language" n="preferredLanguage" f={f} sf={sf} ai/>
          <F l="Emergency Contact" n="emergencyContact" f={f} sf={sf} ai/>
        </div>
      </div>
      <div className="cd"><div className="ch"><div className="ci">🏢</div><div><div className="ht">Employment</div></div></div>
        <div className="fg">
          <F l="Employer / Defendant" n="defendant" f={f} sf={sf} ai c2/>
          <F l="Job Title" n="jobTitle" f={f} sf={sf} ai/>
          <F l="Pay Rate" n="payRate" f={f} sf={sf} ai/>
          {R("atWillOrContract",["At-Will","Written Contract","Oral Contract","Unknown"])}
          {R("employmentStatus",["Still Employed","Resigned","Terminated","Laid Off"])}
          <F l="Start Date" n="startDate" t="date" f={f} sf={sf} ai/>
          <F l="Termination Date" n="terminationDate" t="date" f={f} sf={sf} ai/>
          <F l="Supervisor" n="supervisor" f={f} sf={sf} ai/>
          {R("arbitrationAgreement",["Yes","No","Unknown"])}
          {R("unionMember",["Yes","No","Unknown"])}
          <F l="Employer Reason" n="terminationEmployerReason" t="ta" f={f} sf={sf} ai c2/>
          <F l="Client Belief (Actual Reason)" n="terminationClientBelief" t="ta" f={f} sf={sf} ai c2/>
        </div>
      </div>
      <div className="nb"><button className="bn po" onClick={bk}>Back</button><button className="bn pn pl" onClick={nx}>Claims →</button></div>
    </div>
  );
}

function S3({f,sf,nx,bk}){
  const R=(n,o)=><div className="fd"><label>{n}</label><div className="ri">{o.map(x=><label key={x}><input type="radio" name={n} value={x} checked={f[n]===x} onChange={()=>sf(z=>({...z,[n]:x}))}/>{x}</label>)}</div></div>;
  return(
    <div>
      <div className="cd"><div className="ch"><div className="ci">⚖️</div><div><div className="ht">Discrimination & Harassment</div></div></div>
        <div className="fg">
          {R("discriminationBelief",["Yes","No","Unknown"])}
          {R("sexualHarassment",["Yes","No","Unknown"])}
          <CG l="Protected Classes" n="discriminationClasses" o={DC} f={f} sf={sf}/>
          <F l="Discrimination Evidence" n="discriminationEvidence" t="ta" f={f} sf={sf} ai c2/>
          <F l="Oral Animus" n="oralAnimus" t="ta" f={f} sf={sf} ai c2/>
          <F l="Written Animus" n="writtenAnimus" t="ta" f={f} sf={sf} ai c2/>
        </div>
      </div>
      <div className="cd"><div className="ch"><div className="ci">🏥</div><div><div className="ht">Disability & Leave</div></div></div>
        <div className="fg">
          {R("hasDisability",["Yes","No","Unknown"])}
          {R("terminatedAfterLeave",["Yes","No","N/A"])}
          <F l="Nature of Condition" n="disabilityNature" f={f} sf={sf} ai/>
          <F l="Accommodation Requested" n="accommodationRequested" f={f} sf={sf} ai/>
          <CG l="Leave Types" n="leaveTypes" o={LT} f={f} sf={sf}/>
          <F l="Leave Reason" n="leaveReason" f={f} sf={sf} ai c2/>
        </div>
      </div>
      <div className="cd"><div className="ch"><div className="ci">💰</div><div><div className="ht">Wage & Hour</div></div></div>
        <div className="fg">
          {R("exemptStatus",["Exempt","Non-exempt","Unknown"])}
          {R("hourlyOrSalary",["Hourly","Salaried","Commission"])}
          {R("mealRestBreaks",["Yes","No","Sometimes"])}
          {R("overtimePaid",["Yes","No","Unknown"])}
          <F l="Break Details" n="mealRestDetails" t="ta" f={f} sf={sf} ai c2/>
          <F l="Overtime Details" n="overtimeDetails" t="ta" f={f} sf={sf} ai c2/>
        </div>
      </div>
      <div className="cd"><div className="ch"><div className="ci">🔍</div><div><div className="ht">Witnesses, Evidence & Damages</div></div></div>
        <div className="fg">
          <F l="Witnesses" n="witnessNames" t="ta" f={f} sf={sf} ai c2/>
          <CG l="Documents" n="evidenceDocs" o={ED} f={f} sf={sf}/>
          <F l="Lost Wages" n="lostWages" f={f} sf={sf} ai/>
          <F l="Medical Treatment" n="medicalTreatment" f={f} sf={sf} ai/>
          <F l="Emotional Distress" n="emotionalDistress" t="ta" f={f} sf={sf} ai c2/>
        </div>
      </div>
      <div className="nb"><button className="bn po" onClick={bk}>Back</button><button className="bn pn pl" onClick={nx}>Analyze →</button></div>
    </div>
  );
}

function S4({f,sf,nx,bk}){
  const [busy,setBusy]=useState(false);
  const [er,setEr]=useState("");
  const [autoRan,setAutoRan]=useState(false);
  const go=async()=>{
    setBusy(true);setEr("");
    try{
      const toArr=v=>Array.isArray(v)?v:(typeof v==="string"&&v?v.split(","):[]);
      const facts="CLIENT:"+f.fullName+" EMPLOYER:"+f.defendant+" TITLE:"+f.jobTitle+" PAY:"+f.payRate+" DATES:"+f.startDate+"-"+f.terminationDate+" ARB:"+f.arbitrationAgreement+" CLASSES:"+toArr(f.discriminationClasses).join(",")+" DISABILITY:"+f.hasDisability+" LEAVE:"+toArr(f.leaveTypes).join(",")+" BREAKS:"+f.mealRestBreaks+" OT:"+f.overtimePaid+" EVIDENCE:"+toArr(f.evidenceDocs).join(",")+" FACTS:"+String(f.terminationClientBelief||"").slice(0,400);
      const instr="California employment attorney intake analysis. Return ONLY JSON: {verdict,verdictReason,meritScore,damagesPotential,riskLevel,solUrgency,claimsAnalysis,solNote,strengths,concerns,nextSteps,recommendation}. "+facts;
      const res=await fetch("/api/claude",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:1500,messages:[{role:"user",content:instr}]}),});
      if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error?.message||"Error");}
      const d=await res.json();
      const r=pj(d.content.map(c=>c.text||"").join(""));
      sf(x=>({...x,_verdict:r.verdict,_verdictReason:r.verdictReason,_meritScore:r.meritScore,_damagesPotential:r.damagesPotential,_riskLevel:r.riskLevel,_solUrgency:r.solUrgency,_claimsAnalysis:r.claimsAnalysis,_solNote:r.solNote,_strengths:r.strengths||[],_concerns:r.concerns||[],_nextSteps:r.nextSteps||[],recommendation:r.recommendation||""}));
    }catch(e){setEr("Analysis failed: "+e.message);}
    setBusy(false);
  };
  React.useEffect(()=>{if(!f._verdict&&!autoRan){setAutoRan(true);go();}},[]);
  const sc=(v,t)=>t==="m"?v>=7?"gt":v>=5?"at":"rt":t==="d"?v==="High"?"gt":v==="Medium"?"at":"rt":v==="Low"?"gt":v==="Medium"?"at":"rt";
  const vc=f._verdict==="ACCEPT"?"va":f._verdict==="DECLINE"?"vd":f._verdict?"vr":"";
  return(
    <div>
      <div className="cd"><div className="ch"><div className="ci">🤖</div><div><div className="ht">AI Case Analysis</div></div></div>
        {!f._verdict&&!busy&&<div><div className="al ai2" style={{marginBottom:"1rem"}}>Claude will analyze the intake and provide a case recommendation.</div><button className="bn pn pl" onClick={go}>Run Analysis</button></div>}
        {busy&&<div className="al ai2"><span className="sp" style={{borderTopColor:"#1e40af",borderColor:"#bfdbfe"}}/>&nbsp;Analyzing...</div>}
        {er&&<div className="al aw">⚠️ {er}</div>}
        {f._verdict&&!busy&&(
          <div>
            <div className={"vc "+vc}><div style={{fontSize:"20px",fontWeight:700}}>{f._verdict==="ACCEPT"?"✅":f._verdict==="DECLINE"?"❌":"⚠️"} {f._verdict}</div><div>{f._verdictReason}</div></div>
            <div className="sg2">
              <div className="sb3"><div className={"sn2 "+sc(f._meritScore,"m")}>{f._meritScore}/10</div><div className="sl2">Merit</div></div>
              <div className="sb3"><div className={"sn2 "+sc(f._damagesPotential,"d")}>{f._damagesPotential}</div><div className="sl2">Damages</div></div>
              <div className="sb3"><div className={"sn2 "+sc(f._riskLevel,"r")}>{f._riskLevel}</div><div className="sl2">Risk</div></div>
              <div className="sb3"><div className={"sn2 "+sc(f._solUrgency,"s")}>{f._solUrgency}</div><div className="sl2">SOL</div></div>
            </div>
            {f._claimsAnalysis&&<p style={{fontSize:"14px",lineHeight:"1.7",marginBottom:"12px"}}>{f._claimsAnalysis}</p>}
            {(f._strengths||[]).length>0&&<div style={{marginBottom:"10px"}}><strong>✅ Strengths</strong><ul style={{paddingLeft:"18px",fontSize:"13px",lineHeight:"1.8"}}>{f._strengths.map((s,i)=><li key={i}>{s}</li>)}</ul></div>}
            {(f._concerns||[]).length>0&&<div style={{marginBottom:"10px"}}><strong>⚠️ Concerns</strong><ul style={{paddingLeft:"18px",fontSize:"13px",lineHeight:"1.8"}}>{f._concerns.map((s,i)=><li key={i}>{s}</li>)}</ul></div>}
            {(f._nextSteps||[]).length>0&&<div style={{marginBottom:"10px"}}><strong>📋 Next Steps</strong><ul style={{paddingLeft:"18px",fontSize:"13px",lineHeight:"1.8"}}>{f._nextSteps.map((s,i)=><li key={i}>{s}</li>)}</ul></div>}
            {f._solNote&&<div className="al aw">⏰ {f._solNote}</div>}
            <button className="bn po" style={{marginTop:"12px"}} onClick={go}>Re-analyze</button>
          </div>
        )}
      </div>
      <div className="cd"><div className="ch"><div className="ci">📝</div><div><div className="ht">Staff Notes</div></div></div>
        <div className="fg">
          <F l="Credibility / Demeanor" n="credibilityNotes" t="ta" f={f} sf={sf} ai c2/>
          <F l="Red Flags" n="redFlags" t="ta" f={f} sf={sf} c2/>
          <F l="Case Strengths" n="caseStrengths" t="ta" f={f} sf={sf} ai c2/>
          <F l="Action Items" n="actionItems" t="ta" f={f} sf={sf} ai c2/>
          <F l="Recommendation" n="recommendation" t="sl" o={["Take case","Decline","Refer out","Send to attorney"]} f={f} sf={sf} ai/>
        </div>
      </div>
      <div className="nb"><button className="bn po" onClick={bk}>Back</button><button className="bn pn pl" onClick={nx}>Download PDF →</button></div>
    </div>
  );
}

function S5({f,bk}){
  const [busy,setBusy]=useState(false);
  const [done,setDone]=useState(false);
  const sa=v=>String(v||"").replace(/[^\x20-\x7E]/g," ").slice(0,200);
    const toArr=v=>Array.isArray(v)?v:(typeof v==="string"&&v?v.split(","):[]);
  const gen=async()=>{
    setBusy(true);
    try{
      const {PDFDocument,rgb,StandardFonts}=PDFLib;
      const doc=await PDFDocument.create();
      const fn2=await doc.embedFont(StandardFonts.Helvetica);
      const fb=await doc.embedFont(StandardFonts.HelveticaBold);
      const nv=rgb(.1,.1,.24),rd=rgb(.75,.22,.17),bk2=rgb(0,0,0),gy=rgb(.4,.4,.4);
      const W=612,H=792,M=50;
      const pg=()=>{
        const p=doc.addPage([W,H]);
        p.drawRectangle({x:0,y:H-60,width:W,height:60,color:nv});
        p.drawText("WILLIAMS & SEEMEN, APLC",{x:M,y:H-28,size:13,font:fb,color:rgb(1,1,1)});
        p.drawText("Employment Law Intake - Confidential",{x:M,y:H-45,size:8,font:fn2,color:rgb(.8,.8,.8)});
        p.drawLine({start:{x:M,y:30},end:{x:W-M,y:30},thickness:.5,color:gy});
        p.drawText("Williams & Seemen APLC | 16255 Ventura Blvd Suite 1106 Encino CA 91436 | (818) 898-3300",{x:M,y:18,size:7,font:fn2,color:gy});
        return p;
      };
      const sec=(p,t,y)=>{p.drawRectangle({x:M-5,y:y-4,width:W-2*M+10,height:18,color:nv});p.drawText(t.toUpperCase(),{x:M,y:y+1,size:9,font:fb,color:rgb(1,1,1)});return y-24;};
      const fld=(p,l,v,x,y)=>{p.drawText(l+":",{x,y,size:7.5,font:fb,color:gy});p.drawLine({start:{x,y:y-3},end:{x:x+240,y:y-3},thickness:.3,color:rgb(.8,.8,.8)});if(v)p.drawText(sa(v),{x,y:y-13,size:9,font:fn2,color:bk2});return y-30;};
      const blk=(p,l,v,x,y)=>{p.drawText(l+":",{x,y,size:7.5,font:fb,color:gy});y-=14;if(!v)return y-4;const ws=sa(v).split(" ");let ln2="",ls=[];for(const w of ws){if((ln2+" "+w).length>85){ls.push(ln2);ln2=w;}else ln2=ln2?ln2+" "+w:w;}if(ln2)ls.push(ln2);for(const l2 of ls.slice(0,6)){p.drawText(l2,{x,y,size:9,font:fn2,color:bk2});y-=13;}return y-4;};
      let p=pg(),y=H-80;
      p.drawText("Date: "+sa(f.intakeDate||new Date().toLocaleDateString()),{x:M,y,size:9,font:fn2,color:bk2});
      p.drawText("Staff: "+sa(f.intakeStaff),{x:300,y,size:9,font:fn2,color:bk2});y-=20;
      y=sec(p,"Contact",y);y-=8;
      y=fld(p,"Full Name",f.fullName,M,y);y=fld(p,"Phone",f.primaryPhone,M,y);y=fld(p,"Email",f.email,M,y);y=blk(p,"Address",f.address,M,y);y-=10;
      y=sec(p,"Employment",y);y-=8;
      y=blk(p,"Employer",f.defendant,M,y);y=fld(p,"Title",f.jobTitle,M,y);y=fld(p,"Pay",f.payRate,M,y);y=fld(p,"Start",f.startDate,M,y);y=fld(p,"End",f.terminationDate,M,y);y=fld(p,"Arbitration",f.arbitrationAgreement,M,y);y-=10;
      y=blk(p,"Employer Reason",f.terminationEmployerReason,M,y);y=blk(p,"Client Belief",f.terminationClientBelief,M,y);
      p=pg();y=H-80;
      y=sec(p,"Claims & Leave",y);y-=8;
      y=fld(p,"Discrimination",f.discriminationBelief,M,y);y=blk(p,"Classes",toArr(f.discriminationClasses).join(", "),M,y);y=blk(p,"Leave",toArr(f.leaveTypes).join(", "),M,y);y=fld(p,"After Leave",f.terminatedAfterLeave,M,y);y-=10;
      y=sec(p,"Wage & Hour",y);y-=8;
      y=fld(p,"Breaks",f.mealRestBreaks,M,y);y=blk(p,"Break Details",f.mealRestDetails,M,y);y=fld(p,"OT Paid",f.overtimePaid,M,y);y-=10;
      y=sec(p,"Evidence & Notes",y);y-=8;
      y=blk(p,"Witnesses",f.witnessNames,M,y);y=blk(p,"Documents",toArr(f.evidenceDocs).join(", "),M,y);y=blk(p,"Strengths",f.caseStrengths,M,y);y=blk(p,"Action Items",f.actionItems,M,y);y-=10;
      if(f.recommendation){p.drawRectangle({x:M-5,y:y-20,width:W-2*M+10,height:28,color:rgb(.86,.97,.88)});p.drawText("RECOMMENDATION: "+sa(f.recommendation),{x:M,y:y-12,size:10,font:fb,color:rgb(.06,.4,.2)});y-=38;}
      if(f._verdict){const vc2=f._verdict==="ACCEPT"?rgb(.06,.4,.2):f._verdict==="DECLINE"?rgb(.75,.1,.1):rgb(.5,.3,0);p.drawText("AI: "+f._verdict+" - "+sa(f._verdictReason),{x:M,y:Math.max(y,60),size:9,font:fb,color:vc2});}
      p.drawText("Generated: "+new Date().toLocaleString(),{x:M,y:50,size:7,font:fn2,color:gy});
      p.drawText("CONFIDENTIAL & PRIVILEGED - ATTORNEY WORK PRODUCT",{x:M,y:38,size:7,font:fb,color:rd});
      const bytes=await doc.save();
      const blob=new Blob([bytes],{type:"application/pdf"});
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");a.href=url;
      a.download="Intake_"+(f.fullName||"Client").replace(/\s+/g,"_")+"_"+new Date().toISOString().split("T")[0]+".pdf";
      a.click();URL.revokeObjectURL(url);setDone(true);
    }catch(e){alert("PDF error: "+e.message);}
    setBusy(false);
  };
  const flds=[["Client",f.fullName],["Phone",f.primaryPhone],["Email",f.email],["Employer",f.defendant],["Title",f.jobTitle],["Pay",f.payRate],["Start",f.startDate],["End",f.terminationDate],["Arbitration",f.arbitrationAgreement],["Recommendation",f.recommendation]].filter(([,v])=>v);
  return(
    <div className="cd">
      <div className="ch"><div className="ci">✅</div><div><div className="ht">Ready to Download</div></div></div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px",marginBottom:"1.5rem"}}>
        {flds.map(([l,v])=><div key={l} style={{display:"flex",gap:"8px",fontSize:"13px",padding:"8px 12px",background:"#f8fafc",borderRadius:"8px",border:"1px solid var(--bd)"}}><span style={{color:"var(--mu)",minWidth:"80px"}}>{l}</span><span style={{fontWeight:500}}>{v}</span></div>)}
      </div>
      {f._verdict&&<div className={"vc "+(f._verdict==="ACCEPT"?"va":f._verdict==="DECLINE"?"vd":"vr")} style={{marginBottom:"1rem"}}><div style={{fontWeight:700}}>{f._verdict==="ACCEPT"?"✅":f._verdict==="DECLINE"?"❌":"⚠️"} {f.recommendation||f._verdict}</div><div style={{fontSize:"13px",marginTop:"4px"}}>{f._verdictReason}</div></div>}
      {done&&<div className="al as">✅ PDF downloaded!</div>}
      <div style={{display:"flex",gap:"12px"}}>
        <button className="bn pn pl" onClick={gen} disabled={busy}>{busy?<><span className="sp"/>&nbsp;Generating...</>:"⬇️ Download PDF"}</button>
        <button className="bn po" onClick={()=>{const b=new Blob([JSON.stringify(Object.fromEntries(Object.entries(f).filter(([k])=>!k.startsWith("_"))),null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="Intake_"+(f.fullName||"Client")+".json";a.click();}}>📄 JSON</button>
      </div>
      <div className="nb"><button className="bn po" onClick={bk}>Back</button><button className="bn pg pl" onClick={()=>window.location.reload()}>+ New Intake</button></div>
    </div>
  );
}

function App(){
  const [step,setStep]=useState(1);
  const [form,setForm]=useState({...EF});
  return(
    <div>
      <div className="tb">
        <div style={{display:"flex",alignItems:"center",gap:"12px"}}>
          <div className="tl">W&amp;S</div>
          <div><div style={{fontSize:"15px",fontWeight:600}}>Williams &amp; Seemen, APLC</div><div style={{fontSize:"11px",opacity:.7}}>Employment Law Intake System</div></div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
          {form.fullName&&<span className="bg">👤 {form.fullName}</span>}
          <span style={{fontSize:"12px",color:"rgba(255,255,255,.6)"}}>Confidential</span>
        </div>
      </div>
      <div className="mn">
        <Bar s={step}/>
        {step===1&&<S1 onDone={d=>{setForm(d);setStep(2);}}/>}
        {step===2&&<S2 f={form} sf={setForm} nx={()=>setStep(3)} bk={()=>setStep(1)}/>}
        {step===3&&<S3 f={form} sf={setForm} nx={()=>setStep(4)} bk={()=>setStep(2)}/>}
        {step===4&&<S4 f={form} sf={setForm} nx={()=>setStep(5)} bk={()=>setStep(3)}/>}
        {step===5&&<S5 f={form} bk={()=>setStep(4)}/>}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
