<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Williams &amp; Seemen, APLC — Employment Intake System</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy: #1a1a3e;
  --navy-mid: #2a2a5e;
  --red: #c0392b;
  --gold: #b8860b;
  --bg: #f4f6f9;
  --card: #ffffff;
  --border: #dde1e9;
  --text: #1a1a2e;
  --muted: #6b7280;
  --success: #166534;
  --success-bg: #dcfce7;
  --warn: #92400e;
  --warn-bg: #fef3c7;
}
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
#root { min-height: 100vh; }

.topbar { background: var(--navy); color: white; padding: 0 2rem; height: 60px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
.topbar-brand { display: flex; align-items: center; gap: 12px; }
.topbar-logo { width: 36px; height: 36px; background: var(--red); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: white; line-height: 1.2; text-align: center; }
.topbar-title { font-size: 15px; font-weight: 600; letter-spacing: 0.02em; }
.topbar-sub { font-size: 11px; opacity: 0.7; }
.topbar-actions { display: flex; align-items: center; gap: 8px; }

.main { max-width: 1100px; margin: 0 auto; padding: 2rem; }

.step-bar { display: flex; align-items: center; gap: 0; margin-bottom: 2rem; background: white; border-radius: 12px; padding: 0; overflow: hidden; border: 1px solid var(--border); }
.step { flex: 1; display: flex; align-items: center; gap: 10px; padding: 14px 20px; position: relative; cursor: default; }
.step + .step::before { content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 1px; height: 60%; background: var(--border); }
.step.active { background: var(--navy); color: white; }
.step.done { background: #f0fdf4; color: var(--success); }
.step-num { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: rgba(255,255,255,0.2); flex-shrink: 0; }
.step.active .step-num { background: rgba(255,255,255,0.25); color: white; }
.step.done .step-num { background: var(--success-bg); color: var(--success); }
.step.inactive .step-num { background: #e5e7eb; color: var(--muted); }
.step-label { font-size: 13px; font-weight: 500; }
.step.inactive { color: var(--muted); }

.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
.card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 1.25rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
.card-icon { width: 32px; height: 32px; background: var(--navy); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.section-heading { font-size: 14px; font-weight: 700; color: var(--navy); text-transform: uppercase; letter-spacing: 0.08em; }
.section-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

.field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.field-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
.col-span-2 { grid-column: span 2; }
.col-span-3 { grid-column: span 3; }

.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.field input, .field select, .field textarea {
  padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px;
  font-size: 13px; color: var(--text); background: white;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.field input:focus, .field select:focus, .field textarea:focus {
  outline: none; border-color: var(--navy); box-shadow: 0 0 0 3px rgba(26,26,62,0.1);
}
.field textarea { min-height: 90px; resize: vertical; line-height: 1.5; }
.field.ai-filled input, .field.ai-filled select, .field.ai-filled textarea {
  border-color: #6366f1; background: #f5f3ff;
}

.checkbox-section { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.check-row { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-size: 13px; transition: background 0.1s; }
.check-row:hover { background: #f8fafc; }
.check-row input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--navy); }

.radio-inline { display: flex; gap: 16px; flex-wrap: wrap; padding: 9px 0; }
.radio-inline label { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; color: var(--text); font-weight: normal; text-transform: none; letter-spacing: 0; }
.radio-inline input[type=radio] { width: 14px; height: 14px; accent-color: var(--navy); }

.btn { padding: 9px 20px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 8px; transition: all 0.15s; }
.btn-navy { background: var(--navy); color: white; }
.btn-navy:hover { background: var(--navy-mid); }
.btn-outline { background: white; color: var(--navy); border: 1.5px solid var(--navy); }
.btn-outline:hover { background: #f0f0f8; }
.btn-red { background: var(--red); color: white; }
.btn-red:hover { background: #a93226; }
.btn-green { background: #166534; color: white; }
.btn-green:hover { background: #14532d; }
.btn-lg { padding: 12px 28px; font-size: 15px; border-radius: 10px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-icon { background: none; border: none; cursor: pointer; padding: 6px; border-radius: 6px; color: var(--muted); font-size: 18px; display: inline-flex; align-items: center; }
.btn-icon:hover { background: #f0f0f0; color: var(--text); }

.drop-zone { border: 2px dashed var(--border); border-radius: 12px; padding: 3rem 2rem; text-align: center; cursor: pointer; transition: border-color 0.2s, background 0.2s; }
.drop-zone:hover, .drop-zone.drag-over { border-color: var(--navy); background: #f0f0f8; }
.drop-zone-icon { font-size: 48px; margin-bottom: 1rem; }
.drop-zone-title { font-size: 18px; font-weight: 600; color: var(--navy); margin-bottom: 8px; }
.drop-zone-sub { font-size: 14px; color: var(--muted); }

.alert { padding: 12px 16px; border-radius: 8px; font-size: 13px; margin-bottom: 1rem; display: flex; align-items: flex-start; gap: 10px; }
.alert-info { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; }
.alert-success { background: var(--success-bg); border: 1px solid #86efac; color: var(--success); }
.alert-warn { background: var(--warn-bg); border: 1px solid #fcd34d; color: var(--warn); }

.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.badge-purple { background: #ede9fe; color: #5b21b6; }
.badge-green { background: var(--success-bg); color: var(--success); }
.badge-red { background: #fee2e2; color: #991b1b; }

.progress-ring { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.verdict-card { border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
.verdict-accept { background: var(--success-bg); border: 1.5px solid #86efac; }
.verdict-decline { background: #fee2e2; border: 1.5px solid #fca5a5; }
.verdict-review { background: var(--warn-bg); border: 1.5px solid #fcd34d; }
.verdict-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
.verdict-reason { font-size: 14px; line-height: 1.6; }

.score-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 1rem 0; }
.score-box { background: white; border: 1px solid var(--border); border-radius: 10px; padding: 14px; text-align: center; }
.score-num { font-size: 22px; font-weight: 700; }
.score-label { font-size: 11px; color: var(--muted); margin-top: 2px; }
.green-text { color: #166534; }
.red-text { color: #991b1b; }
.amber-text { color: #92400e; }

.nav-bottom { display: flex; justify-content: space-between; align-items: center; padding-top: 1.5rem; border-top: 1px solid var(--border); margin-top: 1rem; }

.tag { display: inline-block; background: #ede9fe; color: #5b21b6; border-radius: 6px; padding: 2px 8px; font-size: 11px; font-weight: 600; margin-left: 6px; }

textarea.narrative { min-height: 160px; font-family: inherit; }

@media (max-width: 700px) {
  .field-grid, .field-grid-3 { grid-template-columns: 1fr; }
  .col-span-2, .col-span-3 { grid-column: span 1; }
  .score-grid { grid-template-columns: 1fr 1fr; }
  .main { padding: 1rem; }
  .step-label { font-size: 11px; }
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useCallback, useRef } = React;

const EMPTY_FORM = {
  // Header
  intakeDate: "", intakeMethod: "", intakeStaff: "", referralSource: "", attorneyAssigned: "", followUpDate: "",
  // PNC Contact
  fullName: "", preferredName: "", dob: "", address: "", primaryPhone: "", altPhone: "", email: "",
  bestContact: "", preferredLanguage: "", emergencyContact: "", priorAttorney: "", priorAttorneyYN: "",
  // Employment Status
  defendant: "", isGovtEmployer: "", jobTitle: "", payRate: "", atWillOrContract: "",
  startDate: "", endDate: "", supervisor: "", employmentStatus: "", terminationDate: "",
  terminationEmployerReason: "", terminationClientBelief: "", severanceOffered: "", arbitrationAgreement: "", unionMember: "",
  // Basis of Case
  discriminationBelief: "", discriminationClasses: [], discriminationEvidence: "", oralAnimus: "", writtenAnimus: "",
  sexualHarassment: "", protectedClassHarassment: "", harassmentDetails: "",
  // Disability / Leave
  hasDisability: "", disabilityNature: "", disabilityDate: "", accommodationRequested: "", accommodationGranted: "",
  adverseActionDisability: "", leaveTypes: [], leaveReason: "", leaveGranted: "", terminatedAfterLeave: "",
  // Wage & Hour
  exemptStatus: "", hourlyOrSalary: "", mealRestBreaks: "", mealRestDetails: "",
  overtimePaid: "", overtimeDetails: "", finalPaycheckTimely: "", tipsIssues: "",
  // Damages
  lostWages: "", lostBenefits: "", postTermEarnings: "", medicalTreatment: "", emotionalDistress: "",
  // Evidence
  witnessNames: "", evidenceDocs: [], audioRecordings: "", socialMedia: "",
  // Staff Notes
  credibilityNotes: "", redFlags: "", caseStrengths: "", actionItems: "", recommendation: "",
  // AI Analysis
  _verdict: "", _verdictReason: "", _meritScore: "", _damagesPotential: "", _riskLevel: "", _solUrgency: "",
  _claimsAnalysis: "", _solNote: "", _strengths: [], _concerns: [], _nextSteps: [],
};

const DISC_CLASSES = ["Race","Color","National Origin/Ancestry","Religion","Sex/Gender","Sexual Orientation","Gender Identity","Age (40+)","Disability/Medical","Genetic Info","Marital Status","Pregnancy","Military/Veteran","Other"];
const LEAVE_TYPES = ["FMLA","CFRA","PDL (Pregnancy)","CA Paid Sick Leave","Paid Family Leave","Bereavement Leave","Crime Victim Leave","Workers Comp Leave","Other"];
const EVIDENCE_DOCS = ["Offer letter","Employee handbook","Arbitration agreement","Pay stubs/wage statements","W-2/1099","Performance reviews","Written warnings","Emails","Text messages","Internal complaints","Termination letter","Medical records","Therapy records","Photos of injuries","Social media screenshots","Recordings"];

function Field({label, name, form, setForm, type="text", options=[], rows=3, aiField=false, children, placeholder=""}) {
  const val = form[name] ?? "";
  const cls = "field" + (aiField && val ? " ai-filled" : "");
  const update = e => setForm(f => ({...f, [name]: e.target.value}));
  return (
    <div className={cls}>
      <label>{label}{aiField && val ? <span className="tag">AI</span> : null}</label>
      {type === "textarea" ? <textarea rows={rows} value={val} onChange={update} placeholder={placeholder} className={name==="narrative"?"narrative":""} /> :
       type === "select" ? <select value={val} onChange={update}><option value="">Select...</option>{options.map(o => <option key={o} value={o}>{o}</option>)}</select> :
       type === "radio" ? <div className="radio-inline">{options.map(o => <label key={o}><input type="radio" name={name} value={o} checked={val===o} onChange={update}/>{o}</label>)}</div> :
       <input type={type} value={val} onChange={update} placeholder={placeholder} />}
      {children}
    </div>
  );
}

function CheckGroup({label, name, form, setForm, options}) {
  const vals = form[name] || [];
  const toggle = (o) => {
    const next = vals.includes(o) ? vals.filter(x=>x!==o) : [...vals, o];
    setForm(f => ({...f, [name]: next}));
  };
  return (
    <div className="field col-span-2">
      <label>{label}</label>
      <div className="checkbox-section">
        {options.map(o => (
          <label key={o} className="check-row">
            <input type="checkbox" checked={vals.includes(o)} onChange={()=>toggle(o)}/>
            {o}
          </label>
        ))}
      </div>
    </div>
  );
}

function StepBar({step}) {
  const steps = ["Import & Extract","Contact & Employment","Claims & Evidence","Review & Analyze","Download PDF"];
  return (
    <div className="step-bar">
      {steps.map((s,i) => (
        <div key={i} className={"step " + (i+1===step?"active":i+1<step?"done":"inactive")}>
          <div className="step-num">{i+1<step?"✓":i+1}</div>
          <div className="step-label">{s}</div>
        </div>
      ))}
    </div>
  );
}

// ---- STEP 1: Import ----
function Step1({onExtracted}) {
  const [text, setText] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [dragOver, setDragOver] = useState(false);
  const [fileName, setFileName] = useState("");
  const fileRef = useRef();

  const readFile = async (file) => {
    setFileName(file.name);
    setError("");
    const ext = file.name.split(".").pop().toLowerCase();
    if (!["txt","pdf","docx"].includes(ext)) {
      setError("Unsupported file type. Please use PDF, Word (.docx), or plain text (.txt).");
      return;
    }
    if (ext === "txt") {
      const reader = new FileReader();
      reader.onload = e => setText(e.target.result);
      reader.readAsText(file);
    } else {
      // Send to server for extraction (PDF and DOCX)
      try {
        const fd = new FormData();
        fd.append("file", file);
        const res = await fetch("/api/extract-text", { method:"POST", body: fd });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        setText(data.text);
      } catch(e) {
        setError("File read error: " + e.message);
      }
    }
  };

  const handleDrop = (e) => {
    e.preventDefault(); setDragOver(false);
    const file = e.dataTransfer.files[0];
    if (file) readFile(file);
  };

  const extractWithClaude = async () => {
    if (!text.trim()) { setError("Please paste or upload an intake document first."); return; }
    setLoading(true); setError("");
    try {
      const today = new Date().toISOString().split("T")[0];
      const prompt = `You are an expert legal intake analyst for a California employment law firm. Extract ALL available information from this intake document into structured JSON. Be thorough — capture everything mentioned.

INTAKE DOCUMENT:
${text.slice(0, 12000)}

Return ONLY valid JSON (no markdown, no backticks). Map to these exact keys:
{
  "fullName": "", "preferredName": "", "dob": "", "address": "", "primaryPhone": "", "altPhone": "", "email": "",
  "bestContact": "", "preferredLanguage": "", "emergencyContact": "", "priorAttorney": "", "priorAttorneyYN": "",
  "defendant": "", "isGovtEmployer": "", "jobTitle": "", "payRate": "", "atWillOrContract": "At-Will",
  "startDate": "", "endDate": "", "supervisor": "", "employmentStatus": "Terminated", "terminationDate": "",
  "terminationEmployerReason": "", "terminationClientBelief": "", "severanceOffered": "No", "arbitrationAgreement": "",
  "unionMember": "No", "discriminationBelief": "Yes", "discriminationClasses": [],
  "discriminationEvidence": "", "oralAnimus": "", "writtenAnimus": "",
  "sexualHarassment": "No", "protectedClassHarassment": "", "harassmentDetails": "",
  "hasDisability": "", "disabilityNature": "", "disabilityDate": "", "accommodationRequested": "",
  "accommodationGranted": "", "adverseActionDisability": "", "leaveTypes": [], "leaveReason": "",
  "leaveGranted": "", "terminatedAfterLeave": "", "exemptStatus": "Non-exempt", "hourlyOrSalary": "Hourly",
  "mealRestBreaks": "", "mealRestDetails": "", "overtimePaid": "", "overtimeDetails": "",
  "finalPaycheckTimely": "", "tipsIssues": "", "lostWages": "", "lostBenefits": "",
  "postTermEarnings": "", "medicalTreatment": "", "emotionalDistress": "",
  "witnessNames": "", "evidenceDocs": [], "audioRecordings": "", "socialMedia": "",
  "credibilityNotes": "", "redFlags": "", "caseStrengths": "", "actionItems": "", "recommendation": "",
  "intakeDate": "${today}", "intakeMethod": "", "intakeStaff": "",
  "referralSource": "", "attorneyAssigned": "", "followUpDate": ""
}`;

      const res = await fetch("/api/claude", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model:"claude-sonnet-4-5", max_tokens:2000, messages:[{role:"user", content:prompt}] })
      });
      if (!res.ok) {
        const err = await res.json().catch(()=>({}));
        throw new Error(err.error?.message || err.error || "Server error " + res.status);
      }
      const data = await res.json();
      const raw = data.content.map(c => c.text||"").join("");
      const clean = raw.replace(/```json|```/g,"").trim();
      const extracted = JSON.parse(clean);
      onExtracted({...EMPTY_FORM, ...extracted});
    } catch(e) {
      setError("Extraction failed: " + e.message);
    }
    setLoading(false);
  };

  return (
    <div>
      <div className="card">
        <div className="card-header">
          <div className="card-icon">📄</div>
          <div><div className="section-heading">Import intake document</div><div className="section-sub">Upload PDF, Word (.docx), or plain text — or paste text directly</div></div>
        </div>
        <div className={"drop-zone"+(dragOver?" drag-over":"")} style={{marginBottom:"1rem",cursor:"pointer"}}
          onDragOver={e=>{e.preventDefault();setDragOver(true)}}
          onDragLeave={()=>setDragOver(false)}
          onDrop={handleDrop}
          onClick={()=>fileRef.current.click()}>
          <div className="drop-zone-icon">{fileName ? "✅" : "📂"}</div>
          <div className="drop-zone-title">{fileName ? fileName : "Drop file here or click to browse"}</div>
          <div className="drop-zone-sub">Supports PDF, Word (.docx), and plain text (.txt)</div>
          <input ref={fileRef} type="file" accept=".txt,.pdf,.docx"
            style={{display:"none"}} onChange={e=>{ if(e.target.files[0]) readFile(e.target.files[0]); }}/>
        </div>
        <div className="field" style={{marginBottom:"1rem"}}>
          <label>Or paste intake document text directly</label>
          <textarea rows={10} value={text} onChange={e=>setText(e.target.value)}
            placeholder="Paste the full intake document here — contact info, employment details, incident summary, evidence notes..."
            style={{fontFamily:"monospace",fontSize:"12px"}}/>
        </div>
        {error && <div className="alert alert-warn">⚠️ {error}</div>}
        <div className="alert alert-info">
          💡 Claude will read the document and auto-populate all 60+ intake form fields. Fields filled by AI will be highlighted so you can review them.
        </div>
        <div style={{display:"flex",gap:"10px",justifyContent:"flex-end"}}>
          <button className="btn btn-outline" onClick={()=>onExtracted({...EMPTY_FORM})}>Start blank form</button>
          <button className="btn btn-navy btn-lg" onClick={extractWithClaude} disabled={loading||!text.trim()}>
            {loading ? <><span className="spinner"/>&nbsp;Extracting with AI...</> : "🤖 Extract & populate form →"}
          </button>
        </div>
      </div>
    </div>
  );
}

// ---- STEP 2: Contact & Employment ----
function Step2({form, setForm, onNext, onBack}) {
  return (
    <div>
      <div className="card">
        <div className="card-header"><div className="card-icon">📋</div><div><div className="section-heading">Intake header</div></div></div>
        <div className="field-grid">
          <Field label="Intake date" name="intakeDate" type="date" form={form} setForm={setForm} aiField/>
          <Field label="Intake method" name="intakeMethod" type="select" options={["Phone","In-Person","Zoom","Email"]} form={form} setForm={setForm} aiField/>
          <Field label="Intake staff name" name="intakeStaff" form={form} setForm={setForm}/>
          <Field label="Referral source / how heard of firm" name="referralSource" form={form} setForm={setForm} aiField/>
          <Field label="Attorney assigned for review" name="attorneyAssigned" form={form} setForm={setForm}/>
          <Field label="Follow-up date" name="followUpDate" type="date" form={form} setForm={setForm}/>
        </div>
      </div>
      <div className="card">
        <div className="card-header"><div className="card-icon">👤</div><div><div className="section-heading">PNC contact information</div></div></div>
        <div className="field-grid">
          <Field label="Full legal name" name="fullName" form={form} setForm={setForm} aiField/>
          <Field label="Preferred name / nickname" name="preferredName" form={form} setForm={setForm} aiField/>
          <Field label="Date of birth" name="dob" type="date" form={form} setForm={setForm} aiField/>
          <Field label="Primary phone" name="primaryPhone" form={form} setForm={setForm} aiField/>
          <Field label="Email address" name="email" form={form} setForm={setForm} aiField/>
          <Field label="Alternate phone" name="altPhone" form={form} setForm={setForm} aiField/>
          <Field label="Current mailing address" name="address" form={form} setForm={setForm} aiField className="col-span-2"/>
          <Field label="Best time/method to contact" name="bestContact" form={form} setForm={setForm} aiField/>
          <Field label="Preferred language / interpreter needed?" name="preferredLanguage" form={form} setForm={setForm} aiField/>
          <Field label="Emergency / alternate contact" name="emergencyContact" form={form} setForm={setForm} aiField/>
          <div className="field">
            <label>Prior attorney consulted?</label>
            <div className="radio-inline">
              {["Yes","No","Unknown"].map(o=><label key={o}><input type="radio" name="priorAttorneyYN" value={o} checked={form.priorAttorneyYN===o} onChange={()=>setForm(f=>({...f,priorAttorneyYN:o}))}/>{o}</label>)}
            </div>
          </div>
          {form.priorAttorneyYN==="Yes" && <Field label="Prior attorney name/firm" name="priorAttorney" form={form} setForm={setForm} aiField/>}
        </div>
      </div>
      <div className="card">

// ---- STEP 4: Review & Analyze ----
function Step4({form, setForm, onNext, onBack}) {
  const [analyzing, setAnalyzing] = useState(false);
  const [error, setError] = useState("");

  const analyze = async () => {
    setAnalyzing(true); setError("");
    const prompt = `You are a senior California employment attorney reviewing an intake for Williams & Seemen, APLC. Analyze this case and provide a case acceptance recommendation.

CLIENT: ${form.fullName}
EMPLOYER: ${form.defendant}
JOB TITLE: ${form.jobTitle}
PAY: ${form.payRate}
EMPLOYMENT PERIOD: ${form.startDate} to ${form.terminationDate}
EMPLOYMENT TYPE: ${form.atWillOrContract}
ARBITRATION: ${form.arbitrationAgreement}

ALLEGED CLAIMS:
- Protected classes: ${(form.discriminationClasses||[]).join(", ")||"none specified"}
- Discrimination: ${form.discriminationBelief}
- Disability/leave: ${form.hasDisability}, leave types: ${(form.leaveTypes||[]).join(", ")||"none"}
- Terminated after leave: ${form.terminatedAfterLeave}
- Meal/rest breaks: ${form.mealRestBreaks} — ${form.mealRestDetails}
- Overtime paid: ${form.overtimePaid}
- Final paycheck timely: ${form.finalPaycheckTimely}

EVIDENCE: ${(form.evidenceDocs||[]).join(", ")||"none noted"}
WITNESSES: ${form.witnessNames||"none"}
ORAL ANIMUS: ${form.oralAnimus||"none"}
WRITTEN ANIMUS: ${form.writtenAnimus||"none"}

ADDITIONAL CONTEXT: ${form.terminationClientBelief||""} ${form.harassmentDetails||""} ${form.adverseActionDisability||""}

Respond ONLY with valid JSON (no markdown, no backticks):
{
  "verdict": "ACCEPT" or "DECLINE" or "NEEDS REVIEW",
  "verdictReason": "one clear sentence",
  "meritScore": number 1-10,
  "damagesPotential": "Low" or "Medium" or "High",
  "riskLevel": "Low" or "Medium" or "High",
  "solUrgency": "Low" or "Medium" or "High",
  "claimsAnalysis": "2-3 sentences on strongest California legal theories",
  "solNote": "brief SOL analysis — which deadlines apply and when they expire",
  "strengths": ["strength 1", "strength 2", "strength 3"],
  "concerns": ["concern 1", "concern 2"],
  "nextSteps": ["step 1", "step 2", "step 3"],
  "staffNotes": "recommended notes for credibility/red flags section",
  "recommendation": "Take case" or "Decline" or "Refer out" or "Send to attorney for review"
}`;

    try {
      const res = await fetch("/api/claude", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({model:"claude-sonnet-4-5", max_tokens:1500, messages:[{role:"user",content:prompt}]})
      });
      if (!res.ok) {
        const err = await res.json().catch(()=>({}));
        throw new Error(err.error?.message || err.error || "Server error " + res.status);
      }
      const data = await res.json();
      const raw = data.content.map(c=>c.text||"").join("");
      const clean = raw.replace(/```json|```/g,"").trim();
      const r = JSON.parse(clean);
      setForm(f => ({...f,
        _verdict: r.verdict, _verdictReason: r.verdictReason,
        _meritScore: r.meritScore, _damagesPotential: r.damagesPotential,
        _riskLevel: r.riskLevel, _solUrgency: r.solUrgency,
        _claimsAnalysis: r.claimsAnalysis, _solNote: r.solNote,
        _strengths: r.strengths||[], _concerns: r.concerns||[], _nextSteps: r.nextSteps||[],
        credibilityNotes: r.staffNotes||form.credibilityNotes,
        recommendation: r.recommendation||form.recommendation,
      }));
    } catch(e) {
      setError("Analysis failed: " + e.message);
    }
    setAnalyzing(false);
  };

  const vClass = form._verdict==="ACCEPT"?"verdict-accept":form._verdict==="DECLINE"?"verdict-decline":form._verdict?"verdict-review":"";
  const sc = (v, type) => {
    if(type==="merit") return v>=7?"green-text":v>=5?"amber-text":"red-text";
    if(type==="dmg") return v==="High"?"green-text":v==="Medium"?"amber-text":"red-text";
    if(type==="risk") return v==="Low"?"green-text":v==="Medium"?"amber-text":"red-text";
    return v==="Low"?"green-text":v==="Medium"?"amber-text":"red-text";
  };

  return (
    <div>
      <div className="card">
        <div className="card-header"><div className="card-icon">🤖</div><div><div className="section-heading">AI case analysis</div><div className="section-sub">Let Claude review the full intake and recommend accept / decline</div></div></div>
        {!form._verdict && !analyzing && (
          <div>
            <div className="alert alert-info" style={{marginBottom:"1rem"}}>Claude will analyze all the information you've entered and provide a merit score, damages assessment, SOL analysis, and case recommendation.</div>
            <button className="btn btn-navy btn-lg" onClick={analyze}>🔍 Run AI case analysis</button>
          </div>
        )}
        {analyzing && <div className="alert alert-info"><span className="spinner" style={{borderTopColor:"#1e40af",borderColor:"#bfdbfe"}}/>&nbsp; Analyzing case details...</div>}
        {error && <div className="alert alert-warn">⚠️ {error}</div>}
        {form._verdict && !analyzing && (
          <div>
            <div className={"verdict-card " + vClass}>
              <div className="verdict-title">{form._verdict === "ACCEPT" ? "✅" : form._verdict === "DECLINE" ? "❌" : "⚠️"} {form._verdict}</div>
              <div className="verdict-reason">{form._verdictReason}</div>
            </div>
            <div className="score-grid">
              <div className="score-box"><div className={"score-num "+(sc(form._meritScore,"merit"))}>{form._meritScore}/10</div><div className="score-label">Merit score</div></div>
              <div className="score-box"><div className={"score-num "+(sc(form._damagesPotential,"dmg"))}>{form._damagesPotential}</div><div className="score-label">Damages potential</div></div>
              <div className="score-box"><div className={"score-num "+(sc(form._riskLevel,"risk"))}>{form._riskLevel}</div><div className="score-label">Risk level</div></div>
              <div className="score-box"><div className={"score-num "+(sc(form._solUrgency,"sol"))}>{form._solUrgency}</div><div className="score-label">SOL urgency</div></div>
            </div>
            {form._claimsAnalysis && <p style={{fontSize:"14px",lineHeight:"1.7",marginBottom:"12px"}}>{form._claimsAnalysis}</p>}
            {form._strengths.length>0 && <div style={{marginBottom:"10px"}}><strong style={{fontSize:"13px"}}>✅ Strengths</strong><ul style={{paddingLeft:"18px",fontSize:"13px",lineHeight:"1.8"}}>{form._strengths.map((s,i)=><li key={i}>{s}</li>)}</ul></div>}
            {form._concerns.length>0 && <div style={{marginBottom:"10px"}}><strong style={{fontSize:"13px"}}>⚠️ Concerns</strong><ul style={{paddingLeft:"18px",fontSize:"13px",lineHeight:"1.8"}}>{form._concerns.map((c,i)=><li key={i}>{c}</li>)}</ul></div>}
            {form._nextSteps.length>0 && <div style={{marginBottom:"10px"}}><strong style={{fontSize:"13px"}}>📋 Next steps</strong><ul style={{paddingLeft:"18px",fontSize:"13px",lineHeight:"1.8"}}>{form._nextSteps.map((s,i)=><li key={i}>{s}</li>)}</ul></div>}
            {form._solNote && <div className="alert alert-warn" style={{marginTop:"10px"}}>⏰ <strong>SOL:</strong> {form._solNote}</div>}
            <button className="btn btn-outline" style={{marginTop:"12px"}} onClick={analyze}>↻ Re-analyze</button>
          </div>
        )}
      </div>
      <div className="card">
        <div className="card-header"><div className="card-icon">📝</div><div><div className="section-heading">Intake staff notes</div></div></div>
        <div className="field-grid">
          <Field label="Credibility observations / demeanor / inconsistencies" name="credibilityNotes" type="textarea" rows={3} form={form} setForm={setForm} aiField className="col-span-2"/>
          <Field label="Red flags (SOL issues, arbitration, criminal history, etc.)" name="redFlags" type="textarea" rows={3} form={form} setForm={setForm} className="col-span-2"/>
          <Field label="Strengths of case / corroborating evidence" name="caseStrengths" type="textarea" rows={3} form={form} setForm={setForm} aiField className="col-span-2"/>
          <Field label="Action items / documents to collect / follow-up calls" name="actionItems" type="textarea" rows={3} form={form} setForm={setForm} aiField className="col-span-2"/>
          <Field label="Recommendation" name="recommendation" type="select" options={["Take case","Decline","Refer out","Send to attorney for review"]} form={form} setForm={setForm} aiField/>
        </div>
      </div>
      <div className="nav-bottom">
        <button className="btn btn-outline" onClick={onBack}>← Back</button>
        <button className="btn btn-navy btn-lg" onClick={onNext}>Generate PDF →</button>
      </div>
    </div>
  );
}

// ---- STEP 5: Download PDF ----
function Step5({form, onBack}) {
  const [generating, setGenerating] = useState(false);
  const [done, setDone] = useState(false);

  const generatePDF = async () => {
    setGenerating(true);
    try {
      const { PDFDocument, rgb, StandardFonts } = PDFLib;
      const existingPdfBytes = await fetch("/Employment_Intake_Form.pdf").then(r => r.arrayBuffer()).catch(()=>null);
      
      let pdfDoc;
      if (existingPdfBytes) {
        pdfDoc = await PDFDocument.load(existingPdfBytes);
      } else {
        pdfDoc = await PDFDocument.create();
      }

      const font = await pdfDoc.embedFont(StandardFonts.Helvetica);
      const fontBold = await pdfDoc.embedFont(StandardFonts.HelveticaBold);
      const pages = pdfDoc.getPages();
      
      const addText = (page, text, x, y, size=9, bold=false, color=rgb(0,0,0)) => {
        if (!text) return;
        const f = bold ? fontBold : font;
        const str = String(text).replace(/[^ -~]/g, " ").slice(0, 120);
        try { page.drawText(str, {x, y, size, font: f, color}); } catch(e) {}
      };

      const p1 = pages[0];
      if (p1) {
        const {height} = p1.getSize();
        const py = (pdfY) => height - pdfY;
        addText(p1, form.intakeDate, 140, py(240));
        addText(p1, form.intakeMethod, 390, py(240));
        addText(p1, form.intakeStaff, 140, py(313));
        addText(p1, form.referralSource, 390, py(313));
        addText(p1, form.attorneyAssigned, 140, py(387));
        addText(p1, form.followUpDate, 390, py(387));
        addText(p1, form.fullName, 120, py(518));
        addText(p1, form.preferredName, 120, py(558));
        addText(p1, form.dob, 120, py(598));
        addText(p1, form.address, 120, py(638));
        addText(p1, form.primaryPhone, 120, py(678));
        addText(p1, form.altPhone, 120, py(718));
      }
      const p2 = pages[1];
      if (p2) {
        const {height} = p2.getSize();
        const py = (pdfY) => height - pdfY;
        addText(p2, form.email, 120, py(68));
        addText(p2, form.bestContact, 120, py(108));
        addText(p2, form.preferredLanguage, 120, py(148));
        addText(p2, form.emergencyContact, 120, py(188));
        addText(p2, form.defendant, 120, py(368));
        addText(p2, form.jobTitle, 120, py(448));
        addText(p2, form.payRate, 120, py(488));
        addText(p2, `${form.startDate||""} to ${form.terminationDate||""}`, 120, py(568));
        addText(p2, form.supervisor, 120, py(608));
      }

      // Page 3 - employment status continued
      const p3 = pages[2];
      if (p3) {
        const {height} = p3.getSize();
        const py = (y) => height - y;
        addText(p3, form.terminationEmployerReason, 54, py(168), 8);
        addText(p3, form.terminationClientBelief, 54, py(228), 8);
      }

      // Page 6 - Wage & hour
      const p6 = pages[5];
      if (p6) {
        const {height} = p6.getSize();
        const py = (y) => height - y;
        addText(p6, form.mealRestDetails, 54, py(288), 8);
        addText(p6, form.overtimeDetails, 54, py(368), 8);
      }

      // Last page - staff notes
      const lastPage = pages[pages.length-1];
      if (lastPage) {
        const {height} = lastPage.getSize();
        const py = (y) => height - y;
        addText(lastPage, form.credibilityNotes, 54, py(100), 8);
        addText(lastPage, form.redFlags, 54, py(200), 8);
        addText(lastPage, form.caseStrengths, 54, py(300), 8);
        addText(lastPage, form.actionItems, 54, py(400), 8);
        if (form.recommendation) {
          addText(lastPage, "✓ " + form.recommendation, 54, py(550), 9, true, rgb(0.06,0.40,0.20));
        }
        addText(lastPage, new Date().toLocaleDateString(), 400, py(550));
      }

      const pdfBytes = await pdfDoc.save();
      const blob = new Blob([pdfBytes], {type:"application/pdf"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; 
      a.download = `Intake_${(form.fullName||"Client").replace(/\s+/g,"_")}_${new Date().toISOString().split("T")[0]}.pdf`;
      a.click();
      URL.revokeObjectURL(url);
      setDone(true);
    } catch(e) {
      alert("PDF generation error: " + e.message);
    }
    setGenerating(false);
  };

  const downloadJSON = () => {
    const clean = Object.fromEntries(Object.entries(form).filter(([k])=>!k.startsWith("_")));
    const b = new Blob([JSON.stringify(clean, null, 2)], {type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(b);
    a.download = `Intake_${(form.fullName||"Client").replace(/\s+/g,"_")}.json`;
    a.click();
  };

  const fields = [
    ["Client name", form.fullName], ["Phone", form.primaryPhone], ["Email", form.email],
    ["Employer", form.defendant], ["Job title", form.jobTitle], ["Pay", form.payRate],
    ["Start date", form.startDate], ["End date", form.terminationDate],
    ["Arbitration", form.arbitrationAgreement], ["Recommendation", form.recommendation],
  ].filter(([,v])=>v);

  return (
    <div>
      <div className="card">
        <div className="card-header"><div className="card-icon">✅</div><div><div className="section-heading">Intake complete — ready to download</div></div></div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px",marginBottom:"1.5rem"}}>
          {fields.map(([l,v])=>(
            <div key={l} style={{display:"flex",gap:"8px",fontSize:"13px",padding:"8px 12px",background:"#f8fafc",borderRadius:"8px",border:"1px solid var(--border)"}}>
              <span style={{color:"var(--muted)",minWidth:"100px"}}>{l}</span>
              <span style={{fontWeight:500}}>{v}</span>
            </div>
          ))}
        </div>
        {form._verdict && (
          <div className={"verdict-card "+( form._verdict==="ACCEPT"?"verdict-accept":form._verdict==="DECLINE"?"verdict-decline":"verdict-review")} style={{marginBottom:"1.5rem"}}>
            <div style={{fontSize:"15px",fontWeight:700}}>{form._verdict==="ACCEPT"?"✅":form._verdict==="DECLINE"?"❌":"⚠️"} AI Recommendation: {form.recommendation||form._verdict}</div>
            <div style={{fontSize:"13px",marginTop:"4px"}}>{form._verdictReason}</div>
          </div>
        )}
        {done && <div className="alert alert-success">✅ PDF downloaded successfully! The filled intake form has been saved to your downloads folder.</div>}
        <div style={{display:"flex",gap:"12px",flexWrap:"wrap"}}>
          <button className="btn btn-navy btn-lg" onClick={generatePDF} disabled={generating}>
            {generating ? <><span className="spinner"/>&nbsp;Generating PDF...</> : "⬇️ Download filled PDF"}
          </button>
          <button className="btn btn-outline" onClick={downloadJSON}>📄 Export as JSON</button>
        </div>
        <div className="alert alert-info" style={{marginTop:"1rem"}}>
          💡 <strong>Note:</strong> The PDF is filled using the Williams & Seemen intake form template. All extracted and entered data is overlaid onto the original form pages. For best results, ensure the <code>Employment_Intake_Form.pdf</code> is in the same directory as this app.
        </div>
      </div>
      <div className="nav-bottom">
        <button className="btn btn-outline" onClick={onBack}>← Back to edit</button>
        <button className="btn btn-green btn-lg" onClick={()=>window.location.reload()}>＋ New intake</button>
      </div>
    </div>
  );
}

// ---- MAIN APP ----
function App() {
  const [step, setStep] = useState(1);
  const [form, setForm] = useState({...EMPTY_FORM});

  const handleExtracted = (data) => { setForm(data); setStep(2); };

  return (
    <div>
      <div className="topbar">
        <div className="topbar-brand">
          <div className="topbar-logo">W&amp;S<br/>APLC</div>
          <div>
            <div className="topbar-title">Williams &amp; Seemen, APLC</div>
            <div className="topbar-sub">Employment Law Intake System</div>
          </div>
        </div>
        <div className="topbar-actions">
          {form.fullName && <span className="badge badge-purple">👤 {form.fullName}</span>}
          <span style={{fontSize:"12px",color:"rgba(255,255,255,0.6)"}}>Confidential &amp; Privileged</span>
        </div>
      </div>
      <div className="main">
        <StepBar step={step}/>
        {step===1 && <Step1 onExtracted={handleExtracted}/>}
        {step===2 && <Step2 form={form} setForm={setForm} onNext={()=>setStep(3)} onBack={()=>setStep(1)}/>}
        {step===3 && <Step3 form={form} setForm={setForm} onNext={()=>setStep(4)} onBack={()=>setStep(2)}/>}
        {step===4 && <Step4 form={form} setForm={setForm} onNext={()=>setStep(5)} onBack={()=>setStep(3)}/>}
        {step===5 && <Step5 form={form} onBack={()=>setStep(4)}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
